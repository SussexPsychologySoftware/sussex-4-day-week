{{ define "main" }}

<!--{{ partial "jumbotron" (dict "imageUrl" "/img/7.jpg" "title" "This is where the heading goes" "subtitle" "This is where the subtitle goes") }}-->
<div class="ph3 bg-off-white min-vh-100 center mw7 pv4">
    {{ if .Title }}
    <div class="tc pb4">
        <h1 class="f4 f3-l fw3 lh-title mb3 primary ttu">{{ .Title }}</h1>
    </div>
    {{ end }}

    {{ if .Params.body }}
    <div class="tc center mb4">
        BODY
        <p class="f6 fw3 mb3 center">{{ .Params.body }}</p>
    </div>
    {{ end }}

    {{ if .Content }}
    <div class="tc center mb4">
        CONTENT
        <p class="f6 fw3 mb3 center">{{ .Content }}</p>
    </div>
    {{ end }}
</div>

{{ end }}
