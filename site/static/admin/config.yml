backend:
  name: git-gateway
  branch: 4dayweek
media_folder: "site/static/img"
public_folder: "img"

collections:
  - name: "pages"
    label: "Pages"
    files:
      # Homepage
      - file: "site/content/_index.md"
        label: "Homepage"
        name: "home"
        fields:
          - label: "Hero Section"
            name: "hero"
            widget: "object"
            fields:
              - {label: "Slogan", name: "slogan", widget: "string"}
              - {label: "Description", name: "description", widget: "text"}
          - label: "Feature Blocks"
            name: "features"
            widget: "list"
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Description", name: "description", widget: "text"}
              - {label: "Image", name: "image", widget: "image", required: false}
              - {label: "YouTube Embed URL", name: "youtube_embed_src", widget: "string", required: false, hint: "Full YouTube embed URL"}
              - {label: "Link Text", name: "link_text", widget: "string", required: false}
              - {label: "Link URL", name: "link_url", widget: "string", required: false}

      # Success Stories
      - file: "site/content/success-stories/_index.md"
        label: "Success Stories"
        name: "success_stories"
        fields:
          - {label: "Title", name: "title", widget: "string", default: "Success Stories"}
          - {label: "Subtitle", name: "subtitle", widget: "string", required: false}
          - label: "Success Stories"
            name: "success_stories"
            widget: "list"
            fields:
              - {label: "Company Logo", name: "logo", widget: "image"}
              - {label: "Company Name", name: "company", widget: "string"}
              - {label: "Quote", name: "quote", widget: "text"}
              - {label: "Attribution", name: "attribution", widget: "string", required: false}
          - label: "Trial Results"
            name: "trial_results"
            widget: "object"
            fields:
              - {label: "Heading", name: "heading", widget: "string", default: "TRIAL RESULTS"}
              - label: "Company Results"
                name: "logos"
                widget: "list"
                fields:
                  - {label: "Company Logo", name: "logo", widget: "image"}
                  - {label: "Company Name", name: "company", widget: "string"}
                  - {label: "Who They Are", name: "who", widget: "string"}
                  - {label: "Key Learnings", name: "learnings", widget: "text"}
                  - {label: "Website Link", name: "link", widget: "string", required: false}
          - label: "Participating Employers"
            name: "participating_employers"
            widget: "object"
            fields:
              - {label: "Heading", name: "heading", widget: "string", default: "PARTICIPATING EMPLOYERS"}
              - label: "Company Logos"
                name: "logos"
                widget: "list"
                fields:
                  - {label: "Company Name", name: "name", widget: "string"}
                  - {label: "Logo", name: "logo", widget: "image"}
                  - {label: "Website Link", name: "link", widget: "string", required: false}
          - label: "Research Findings"
            name: "research_findings"
            widget: "object"
            fields:
              - {label: "Heading", name: "heading", widget: "string", default: "RESEARCH FINDINGS"}
              - {label: "Description", name: "description", widget: "text", required: false}
              - {label: "Results Image", name: "image", widget: "image"}
              - {label: "Image Alt Text", name: "image_alt", widget: "string", default: "Research Findings Results"}
          - label: "Consultant Quote"
            name: "consultant_quote"
            widget: "object"
            fields:
              - {label: "Quote", name: "quote", widget: "text"}
              - {label: "Attribution", name: "attribution", widget: "string"}

      # How It Works
      - file: "site/content/how-it-works/_index.md"
        label: "How It Works"
        name: "how_it_works"
        fields:
          - {label: "Title", name: "title", widget: "string", default: "How It Works"}
          - label: "Process Steps"
            name: "process_steps"
            widget: "list"
            fields:
              - {label: "Icon/Logo", name: "icon", widget: "image"}
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Description", name: "description", widget: "text"}
              - {label: "Email", name: "email", widget: "string", required: false, hint: "Optional email for this step"}
          - label: "Registration Section"
            name: "registration"
            widget: "object"
            fields:
              - {label: "Heading", name: "heading", widget: "string", default: "Register Here"}
              - {label: "Description", name: "description", widget: "text", required: false}
              - {label: "Button Text", name: "button_text", widget: "string", default: "REGISTER HERE"}
              - {label: "Form URL", name: "form_url", widget: "string", hint: "Link to sign-up form or page"}

      # Control Employer
      - file: "site/content/control-employer/_index.md"
        label: "Be a Control Employer"
        name: "control_employer"
        fields:
          - {label: "Title", name: "title", widget: "string", default: "Be a Control Employer"}
          - {label: "Introduction", name: "intro", widget: "text"}
          - label: "Benefits"
            name: "benefits"
            widget: "list"
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Description", name: "description", widget: "text"}

      # Team
      - file: "site/content/team/_index.md"
        label: "The Team"
        name: "team"
        fields:
          - {label: "Title", name: "title", widget: "string", default: "The Team"}
          - label: "Team Members"
            name: "team_members"
            widget: "list"
            fields:
              - {label: "Name", name: "name", widget: "string"}
              - {label: "Role", name: "role", widget: "string"}
              - {label: "Photo", name: "photo", widget: "image", required: false}
              - {label: "Bio", name: "bio", widget: "text"}
              - {label: "Email", name: "email", widget: "string", required: false}
              - {label: "Research Text", name: "research_text", widget: "string", required: false, hint: "Link text for research"}
              - {label: "Research Link", name: "research_link", widget: "string", required: false}

      # Contact
      - file: "site/content/contact/_index.md"
        label: "Get in Touch"
        name: "contact"
        fields:
          - {label: "Title", name: "title", widget: "string", default: "Get in Touch!"}
          - {label: "Email", name: "email", widget: "string"}
          - {label: "Instructions", name: "instructions", widget: "text"}
          - label: "Form Settings"
            name: "form"
            widget: "object"
            fields:
              - {label: "Form Name", name: "name", widget: "string", default: "Contact Us"}
              - {label: "Success Message", name: "success_message", widget: "text", default: "Thank you for your message! We'll get back to you within 2 business days."}
              - {label: "Submit Button Text", name: "submit_text", widget: "string", default: "Send Message"}

      # Resources
      - file: "site/content/resources/_index.md"
        label: "Resources"
        name: "resources"
        fields:
          - {label: "Title", name: "title", widget: "string", default: "Resources"}
          - {label: "Hero Image", name: "hero_image", widget: "image", required: false}
          - label: "PDF Guide"
            name: "pdf_guide"
            widget: "object"
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Description", name: "description", widget: "text"}
              - {label: "PDF File", name: "file", widget: "file", allow_multiple: false, media_folder: "/site/static/files", public_folder: "/files"}
              - {label: "Download Button Text", name: "button_text", widget: "string", default: "DOWNLOAD YOUR FREE GUIDE"}
              - {label: "Bottom Text", name: "bottom_text", widget: "text", required: false}
          - label: "Partner Organizations"
            name: "partners"
            widget: "list"
            fields:
              - {label: "Name", name: "name", widget: "string"}
              - {label: "Logo", name: "logo", widget: "image"}
              - {label: "Description Text", name: "text", widget: "string", required: false}
              - {label: "Website", name: "website", widget: "string", required: false}
              - {label: "Redirect Text", name: "redirect_text", widget: "string", required: false}
              - {label: "Extra Link", name: "extra_link", widget: "string", required: false}

      # Sign-up Page
      - file: "site/content/signup/_index.md"
        label: "Sign-up Page"
        name: "signup"
        fields:
          - { label: "Title", name: "title", widget: "string", default: "Join the Programme" }
          - { label: "Introduction", name: "intro", widget: "text" }

  # Site Settings
  - name: "site_settings"
    label: "Site Settings"
    files:
      - file: "site/data/footer.json"
        label: "Footer"
        name: "footer"
        fields:
          - {label: "Newsletter Text", name: "newsletter_text", widget: "string", default: "Sign up with your email address to receive news and updates."}
          - {label: "Copyright Name", name: "copyright_name", widget: "string", default: "Sussex 4 Day Week"}
          - label: "Social Links"
            name: "social"
            widget: "list"
            required: false
            fields:
              - {label: "Platform", name: "platform", widget: "string"}
              - {label: "URL", name: "url", widget: "string"}

      # Navigation
      - file: "site/data/navigation.json"
        label: "Navigation"
        name: "navigation"
        fields:
          - label: "Main Navigation"
            name: "main"
            widget: "list"
            fields:
              - {label: "Page Name", name: "name", widget: "string"}
              - {label: "URL", name: "url", widget: "string"}
              - {label: "Order", name: "weight", widget: "number", default: 1}
          - label: "Social Links"
            name: "social"
            widget: "list"
            required: false
            fields:
              - { label: "Platform", name: "platform", widget: "string" }
              - { label: "URL", name: "url", widget: "string" }
              - { label: "SVG Icon", name: "svg", widget: "text", hint: "SVG code for the icon" }